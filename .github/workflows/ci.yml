name: CI

on:
  push:
    branches: [main, feature/tutor-module, feature/EDUNEXA-MODELES]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
      GROQ_ALLOW_STUDENT_DATA: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Validate migration filenames
        run: npm run check:migrations
      - name: Validate classroom authorization migration
        run: npm run check:classroom-scope
      - name: Validate administrative document security migration
        run: npm run check:admin-documents
      - name: Validate Secretary student read scope
        run: npm run check:secretary-scope
      - name: Validate Groq-only academic AI
        run: npm run check:academic-ai
      - name: Validate submission history security
        run: npm run check:submission-history
      - name: Validate private student assignment drafts
        run: npm run check:student-drafts
      - name: Validate student assignment due reminders
        run: npm run check:assignment-reminders
      - name: Validate published academic history
        run: npm run check:academic-history
      - name: Validate Tutor notification security and UI
        run: npm run check:guardian-notifications
      - name: Validate Tutor child-scoped academic progress access
        run: npm run check:guardian-progress
      - name: Validate Tutor integration across eight areas
        run: npm run check:tutor-integration
      - name: Validate local Tutor demo isolation
        run: npm run check:tutor-demo
      - name: Validate single-school access
        run: npm run check:single-school
      - name: Validate role-scoped authorization, Hosted role matrix and report-card audience
        run: npm run check:role-scoped-authz
      - name: Validate global Superadmin and eight-module boundary
        run: npm run check:platform-roles
      - name: Validate Superadmin control-plane security contract
        run: npm run check:superadmin
      - name: Validate seven institutional route guards and action permissions
        run: npm run check:seven-module-guards
      - name: Build
        run: npm run build
      - name: Smoke test public routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/edunexa-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npm run test:smoke

      - name: Install pinned Playwright browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.58.2
      - name: Install Chromium for local synthetic E2E
        run: npx playwright install --with-deps chromium
      - name: Verify login UI and anonymous access boundaries for all eight modules
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: npx playwright test --config=e2e/local-playwright.config.mjs


  guardian-progress-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edunexa_guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edunexa_guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate Tutor academic progress in isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edunexa_guardian_test
        run: bash scripts/test-guardian-assignment-progress-postgres.sh
      - name: Create separate role authorization test database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres edunexa_role_auth_test
      - name: Validate role-scoped authorization in isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edunexa_role_auth_test
        run: bash scripts/test-role-scoped-authz-postgres.sh
      - name: Create isolated module transaction test database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres edunexa_modules_test
      - name: Validate module transactions against ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edunexa_modules_test
        run: bash scripts/test-module-transactions-postgres.sh
      - name: Create isolated Superadmin control-plane test database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres edunexa_superadmin_test
      - name: Validate Superadmin authorization, audit and isolation in ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edunexa_superadmin_test
        run: bash scripts/test-superadmin-control-plane-postgres.sh

  student-notifications-e2e:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/student-module-mobile' && vars.ENABLE_STAGING_NOTIFICATION_E2E == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://edunexa-groq-staging.onrender.com
      E2E_INSTITUTION_SLUG: ${{ secrets.E2E_INSTITUTION_SLUG }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_DUE_ASSIGNMENT_TITLE: ${{ secrets.E2E_DUE_ASSIGNMENT_TITLE }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify synthetic student fixture configuration
        run: |
          for key in E2E_INSTITUTION_SLUG E2E_STUDENT_EMAIL E2E_STUDENT_PASSWORD E2E_DUE_ASSIGNMENT_TITLE; do
            if [ -z "${!key}" ]; then echo "Missing secret: $key"; exit 1; fi
          done
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run student due-notification browser test against staging
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/student-due-notifications.spec.mjs

  role-login-modules-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ENABLE_ROLE_LOGIN_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.EDUNEXA_E2E_BASE_URL }}
      E2E_INSTITUTION_SLUG: ${{ secrets.E2E_INSTITUTION_SLUG }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_TUTOR_EMAIL: ${{ secrets.E2E_TUTOR_EMAIL }}
      E2E_TUTOR_PASSWORD: ${{ secrets.E2E_TUTOR_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_DIRECTOR_EMAIL: ${{ secrets.E2E_DIRECTOR_EMAIL }}
      E2E_DIRECTOR_PASSWORD: ${{ secrets.E2E_DIRECTOR_PASSWORD }}
      E2E_ADMINISTRATIVE_EMAIL: ${{ secrets.E2E_ADMINISTRATIVE_EMAIL }}
      E2E_ADMINISTRATIVE_PASSWORD: ${{ secrets.E2E_ADMINISTRATIVE_PASSWORD }}
      E2E_PREFECT_EMAIL: ${{ secrets.E2E_PREFECT_EMAIL }}
      E2E_PREFECT_PASSWORD: ${{ secrets.E2E_PREFECT_PASSWORD }}
      E2E_SECRETARIA_EMAIL: ${{ secrets.E2E_SECRETARIA_EMAIL }}
      E2E_SECRETARIA_PASSWORD: ${{ secrets.E2E_SECRETARIA_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify synthetic login fixtures are configured
        run: |
          for key in E2E_BASE_URL E2E_INSTITUTION_SLUG E2E_TEACHER_EMAIL E2E_TEACHER_PASSWORD E2E_STUDENT_EMAIL E2E_STUDENT_PASSWORD E2E_TUTOR_EMAIL E2E_TUTOR_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_DIRECTOR_EMAIL E2E_DIRECTOR_PASSWORD E2E_ADMINISTRATIVE_EMAIL E2E_ADMINISTRATIVE_PASSWORD E2E_PREFECT_EMAIL E2E_PREFECT_PASSWORD E2E_SECRETARIA_EMAIL E2E_SECRETARIA_PASSWORD; do
            if [ -z "${!key}" ]; then echo "Missing synthetic E2E setting: $key"; exit 1; fi
          done
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify single login and role modules in browser
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/login-role-modules.spec.mjs
