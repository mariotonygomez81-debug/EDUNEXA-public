name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
      GROQ_ALLOW_STUDENT_DATA: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Validate migration filenames
        run: npm run check:migrations
      - name: Validate classroom authorization migration
        run: npm run check:classroom-scope
      - name: Validate administrative document security migration
        run: npm run check:admin-documents
      - name: Validate Secretary student read scope
        run: npm run check:secretary-scope
      - name: Validate Groq-only academic AI
        run: npm run check:academic-ai
      - name: Validate submission history security
        run: npm run check:submission-history
      - name: Validate private student assignment drafts
        run: npm run check:student-drafts
      - name: Validate student assignment due reminders
        run: npm run check:assignment-reminders
      - name: Build
        run: npm run build
      - name: Smoke test public routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/edunexa-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npm run test:smoke

  student-notifications-e2e:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/student-module-mobile' && vars.ENABLE_STAGING_NOTIFICATION_E2E == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://edunexa-groq-staging.onrender.com
      E2E_INSTITUTION_SLUG: ${{ secrets.E2E_INSTITUTION_SLUG }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_DUE_ASSIGNMENT_TITLE: ${{ secrets.E2E_DUE_ASSIGNMENT_TITLE }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify synthetic student fixture configuration
        run: |
          for key in E2E_INSTITUTION_SLUG E2E_STUDENT_EMAIL E2E_STUDENT_PASSWORD E2E_DUE_ASSIGNMENT_TITLE; do
            if [ -z "${!key}" ]; then echo "Missing secret: $key"; exit 1; fi
          done
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run student due-notification browser test against staging
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/student-due-notifications.spec.mjs
